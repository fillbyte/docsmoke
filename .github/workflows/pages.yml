name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Actions are pinned to immutable commit SHAs per GitHub's security
# hardening guidance. Comments retain the human-readable upstream
# version so Dependabot updates stay reviewable.

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble and validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/schemas
          cp -R docs/site/. _site/
          cp schemas/report.schema.json _site/schemas/report.schema.json
          cmp --silent schemas/report.schema.json _site/schemas/report.schema.json
          jq --exit-status \
            --arg canonical_id "https://fillbyte.github.io/docsmoke/schemas/report.schema.json" \
            '.["$id"] == $canonical_id' \
            _site/schemas/report.schema.json >/dev/null

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy Pages site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
